version: "3.8"
services:
  db:
    container_name: miniLinkedIn_Db_NodeJS112
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    command: postgres -c listen_addresses="*"
  pgadmin:
    container_name: miniLinkedIn_pgadmin_nodeJS112
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
  app:
    container_name: miniLinkedIn_ContainerNodeJS112
    build: ./
    ports:
      - "4700:4700"
    depends_on:
      - db
